services:
  laravel_web:
    image: chialab/php:8.2-apache
    container_name: laravel_01
    env_file:
      - .env
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb_01
      - DB_PORT=3306
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
    networks:
      - la_network

  mariadb_01:
    image: mariadb:11.4.4
    container_name: mariadb_01
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - ./datos_mariadb:/var/lib/mysql
    networks:
      - la_network

networks:
  la_network:
    external: true